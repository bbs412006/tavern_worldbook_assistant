name: Worldbook Verify

on:
  push:
    branches: [ST-Manager-STscript]
  pull_request:
    branches: [ST-Manager-STscript]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify worldbook quality gates and tracked bundle
        run: |
          if ! pnpm verify:worldbook:ci 2>&1 | tee /tmp/worldbook-verify.log; then
            echo '::group::Worldbook verification tail'
            tail -n 160 /tmp/worldbook-verify.log
            echo '::endgroup::'
            exit 1
          fi
      - name: Ensure verification leaves the repository clean
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
